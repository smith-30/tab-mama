name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check (oxfmt)
        run: pnpm format:check

      - name: Lint (oxlint)
        run: pnpm lint

      - name: Secret check (secretlint)
        run: pnpm secretlint --secretlintrc .secretlintrc.json "**/*"

      - name: Test (vitest)
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Upload dist artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  badge:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # gh-pages への連続 push を直列化する。短時間の複数 push で GitHub の
    # pages デプロイが競合し "Deployment failed, try again later." になるのを防ぐ。
    # バッジは最新サイズだけ分かればよいので進行中は新しい push で置き換える。
    concurrency:
      group: badge-gh-pages
      cancel-in-progress: true

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Generate dist size badge JSON
        run: |
          BYTES=$(du -sb dist/ | cut -f1)
          KB=$(( BYTES / 1024 ))
          if [ "$KB" -ge 1024 ]; then
            SIZE="$(echo "scale=1; $KB / 1024" | bc) MB"
          else
            SIZE="${KB} KB"
          fi
          mkdir -p badges
          printf '{"schemaVersion":1,"label":"extensionSize","message":"%s","color":"5b8dee"}\n' "$SIZE" > badges/dist-size.json

      - name: Deploy badge to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./badges
          destination_dir: badges
          keep_files: true
